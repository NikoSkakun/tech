    <style>html,body{color:#f6f3ff;-webkit-font-smoothing:antialiased;background:#070a1f;height:100%;margin:0;font-family:ui-rounded,Nunito,Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif;overflow:hidden}#app,#stage{width:100%;height:100%;display:block;position:fixed;inset:0}#stage{touch-action:none;-webkit-user-select:none;user-select:none;outline:none}.screen{z-index:10;background:radial-gradient(120% 90% at 50% 38%,#2e1f7a 0%,#1a1657 32%,#0d1136 62%,#070a1f 100%);place-items:center;transition:opacity .7s;display:grid;position:fixed;inset:0}.screen[hidden]{display:none}.screen.out{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .7s,visibility 0s linear .7s}.boot-box{text-align:center;width:min(440px,82vw)}.orbit{width:132px;height:132px;margin:0 auto 30px;position:relative}.orbit i{border:3px solid #8e5cf766;border-radius:50%;position:absolute;inset:0}.orbit i:nth-child(2){border:0;animation:2.6s linear infinite spin;inset:0}.orbit i:nth-child(2):after{content:"";background:#2de2e6;border-radius:50%;width:18px;height:18px;margin-left:-9px;position:absolute;top:-9px;left:50%;box-shadow:0 0 18px 4px #2de2e6bf,0 0 46px 12px #2de2e64d}.orbit i:nth-child(3){background:radial-gradient(circle at 36% 32%,#ffe680 0%,#ffd23f 45%,#ffb02e 100%);border:0;animation:2.2s ease-in-out infinite pulse;inset:38px;box-shadow:0 0 34px 6px #ffd23f66}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08)}}.boot-title{letter-spacing:.01em;margin:0 0 6px;font-size:clamp(26px,4.2vw,38px);font-weight:800}.boot-sub{color:#c9c6ea;margin:0 0 28px;font-size:16px}.bar{background:#0d1136e6;border-radius:99px;height:10px;overflow:hidden;box-shadow:inset 0 0 0 1.5px #2de2e64d}.bar>b{background:linear-gradient(90deg,#1cc8a5,#2de2e6);border-radius:99px;width:4%;height:100%;transition:width .25s;display:block;box-shadow:0 0 16px #2de2e6b3}.boot-note{color:#8d8fb8;font-variant-numeric:tabular-nums;min-height:20px;margin-top:14px;font-size:14px}#fatal .boot-box{width:min(560px,86vw)}#fatal h1{margin:0 0 14px;font-size:clamp(24px,3.6vw,32px);font-weight:800}#fatal p{color:#c9c6ea;margin:0 0 12px;font-size:17px;line-height:1.5}#fatal code{color:#8d8fb8;word-break:break-word;margin:14px 0 0;font-size:13px;display:block}#fatal button{color:#070a1f;font:inherit;cursor:pointer;background:#2de2e6;border:0;border-radius:99px;margin-top:22px;padding:13px 30px;font-size:17px;font-weight:800;box-shadow:0 0 22px #2de2e673}#fatal button:hover{background:#7ef0f2}.sr-only{clip-path:inset(50%);white-space:nowrap;width:1px;height:1px;position:absolute;overflow:hidden}@media (prefers-reduced-motion:reduce){.orbit i{animation:none!important}}</style>

    <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-DK3Fl9T5.js">

  <body>
    <div id="app"><canvas id="stage" tabindex="0" aria-label="Інтерактивна 3D-сцена посібника"></canvas></div>

    <div id="boot" class="screen" role="status" aria-live="polite">
      <div class="boot-box">
        <div class="orbit" aria-hidden="true"><i></i><i></i><i></i></div>
        <h1 class="boot-title">Від електрона до розетки</h1>
        <p class="boot-sub">Інтерактивний 3D-посібник з електроенергії</p>
        <div class="bar" aria-hidden="true"><b id="boot-bar"></b></div>
        <div class="boot-note" id="boot-note">Завантаження… 0 %</div>
      </div>
    </div>

    <div id="fatal" class="screen" role="alert" hidden>
      <div class="boot-box">
        <h1 id="fatal-title"></h1>
        <p id="fatal-text"></p>
        <p id="fatal-hint"></p>
        <code id="fatal-detail"></code>
        <button id="fatal-retry" type="button">Спробувати знову</button>
      </div>
    </div>

    <!-- invisible live region for assistive technology (the HUD announces step titles here) -->
    <div id="live" class="sr-only" aria-live="polite"></div>
    <noscript>
      <div class="screen">
        <div class="boot-box"><h1 class="boot-title">Потрібен JavaScript</h1></div>
      </div>
    </noscript>
  </body>
</html>
